<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-label="HostVigil">
  <defs>
    <linearGradient id="hv-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="hv-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0FBFF"/>
      <stop offset="0.45" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="hv-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="160" fill="#FFFFFF"/>
  <!-- mark -->
  <g transform="translate(80 80)">
    <!-- outer hexagonal shield -->
    <path d="M0,-62 L54,-31 L54,31 L0,62 L-54,31 L-54,-31 Z" fill="none" stroke="url(#hv-grad)" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>
    <!-- inner hexagon, dashed orbit -->
    <path d="M0,-46 L40,-23 L40,23 L0,46 L-40,23 L-40,-23 Z" fill="none" stroke="#22D3EE" stroke-width="1.25" stroke-dasharray="6 5" opacity="0.55"/>
    <!-- scan ring -->
    <circle r="30" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="120 70" stroke-linecap="round" opacity="0.9" filter="url(#hv-glow)" transform="rotate(-30)"/>
    <!-- aperture eye -->
    <path d="M-22,0 C-14,-14 14,-14 22,0 C14,14 -14,14 -22,0 Z" fill="none" stroke="#E0FBFF" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- core -->
    <circle r="11" fill="url(#hv-core)" filter="url(#hv-glow)"/>
    <circle r="5.5" fill="#FFFFFF"/>
    <circle r="2.5" fill="#E0FBFF"/>
    <!-- tick marks -->
    <g stroke="#22D3EE" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <line x1="0" y1="-56" x2="0" y2="-50"/>
      <line x1="0" y1="50" x2="0" y2="56"/>
    </g>
  </g>
  <!-- wordmark -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="170" y="92" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#0B0F17">Host<tspan fill="url(#hv-grad)">Vigil</tspan></text>
    <text x="173" y="122" font-size="14" font-weight="500" letter-spacing="5" fill="#64748B">KNOW YOUR BASELINE · SEE THE DRIFT</text>
  </g>
</svg>
