<title>HostVigil HUD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail + top filter bar + scrolling canvas + right drill-down drawer. Dark mission-control, single theme by design. */
:root{
  color-scheme:dark;
  --bg:#0B0F17; --bg2:#0F1522; --panel:rgba(17,24,39,.72); --panel2:rgba(22,30,48,.85);
  --line:rgba(148,163,184,.14); --line2:rgba(34,211,238,.28);
  --fg:#E6EDF7; --fg2:#9AA8BD; --fg3:#64748B;
  --accent:#22D3EE; --accent2:#0EA5E9; --accent-dim:rgba(34,211,238,.14);
  --good:#10B981; --warn:#F59E0B; --serious:#F97316; --crit:#F43F5E;
  --c1:#0891B2; --c2:#A855F7; --c3:#D97706; --c4:#EC4899; --c5:#059669; --c6:#6366F1;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --rail:64px; --top:56px; --drawer:420px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.45;overflow:hidden;
  background-image:radial-gradient(1200px 600px at 10% -10%,rgba(14,165,233,.10),transparent 60%),radial-gradient(900px 500px at 100% 110%,rgba(168,85,247,.08),transparent 60%);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
#app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:var(--top) 1fr;height:100%;}
#rail{grid-row:1/3;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-block:10px;gap:4px;padding-left:env(safe-area-inset-left,0px)}
#rail .logo{width:40px;height:40px;margin-bottom:10px}
#rail button{width:48px;height:48px;border:0;background:transparent;border-radius:var(--r);color:var(--fg3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;letter-spacing:.3px;position:relative}
#rail button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#rail button:hover{color:var(--fg);background:rgba(255,255,255,.04)}
#rail button.active{color:var(--accent);background:var(--accent-dim)}
#rail button.active::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
#rail .badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding-inline:4px}
#rail .spacer{flex:1}

#top{display:flex;align-items:center;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:rgba(11,15,23,.7);backdrop-filter:blur(12px);overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#top h1{font-size:14px;font-weight:600;margin:0;white-space:nowrap;letter-spacing:.2px}
#top h1 span{color:var(--fg3);font-weight:500}
.sep{width:1px;height:22px;background:var(--line);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg2);white-space:nowrap;font-size:12px}
.chip.on{border-color:var(--line2);color:var(--fg);background:var(--accent-dim)}
.chip .x{opacity:.6;font-size:14px;line-height:1;padding-left:2px}
.chip .x:hover{opacity:1;color:var(--crit)}
.chip select{background:transparent;border:0;color:var(--fg);outline:0;padding:0;max-width:140px}
.chip input{background:transparent;border:0;outline:0;width:170px;color:var(--fg)}
.chip input::placeholder{color:var(--fg3)}
.chip.ghost{border-style:dashed;color:var(--fg3)}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--fg3)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);font-size:11px;white-space:nowrap;margin-left:auto}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

#main{overflow:auto;padding-block:16px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;position:relative;backdrop-filter:blur(8px)}
.card.glow{border-color:var(--line2);box-shadow:0 0 0 1px rgba(34,211,238,.05),0 10px 40px -20px rgba(34,211,238,.35)}
.card h3{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--fg3);display:flex;align-items:center;gap:8px}
.card h3 .right{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;color:var(--fg3)}
.card h3 button{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--fg2);font-size:11px;padding:2px 8px}
.card h3 button:hover{border-color:var(--line2);color:var(--fg)}
.s3{grid-column:span 3}.s5{grid-column:span 5}.s7{grid-column:span 7}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}.s2{grid-column:span 2}
@media (max-width:1100px){.s3,.s2,.s5,.s7{grid-column:span 6}.s4{grid-column:span 6}.s8{grid-column:span 12}}
@media (max-width:700px){.s3,.s2,.s4,.s5,.s6,.s7{grid-column:span 12}#app{grid-template-columns:1fr}#rail{grid-row:auto;position:fixed;bottom:0;left:0;right:0;flex-direction:row;justify-content:space-around;padding-block:4px;z-index:20;border-right:0;border-top:1px solid var(--line);padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}#rail .logo,#rail .spacer{display:none}#rail button{width:44px;height:44px}#rail button.active::before{display:none}#main{padding-bottom:76px;padding-left:max(16px,env(safe-area-inset-left,0px))}#drawer{width:100vw}}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:transform .15s}
.kpi:hover{transform:translateY(-1px);border-color:var(--line2)}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--fg3)}
.kpi .d{font-size:11px;color:var(--fg2);display:flex;align-items:center;gap:6px}
.kpi .d b{font-weight:600}
.kpi svg.spark{position:absolute;right:12px;top:30px;width:90px;height:34px;opacity:.9}
.kpi .l{padding-right:96px}
.up{color:var(--crit)}.down{color:var(--good)}

/* severity */
.sev{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px}
.sev::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.sev.critical{color:var(--crit);background:rgba(244,63,94,.12)}.sev.high{color:var(--serious);background:rgba(249,115,22,.12)}.sev.medium{color:var(--warn);background:rgba(245,158,11,.12)}.sev.low{color:var(--good);background:rgba(16,185,129,.12)}.sev.info{color:var(--fg2);background:rgba(148,163,184,.12)}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--fg2)}
.tier i{width:8px;height:8px;border-radius:2px}
.pill{display:inline-block;padding:1px 7px;border-radius:5px;border:1px solid var(--line);font-size:11px;color:var(--fg2)}
.pill.ok{color:var(--good);border-color:rgba(16,185,129,.4)}.pill.bad{color:var(--crit);border-color:rgba(244,63,94,.4)}.pill.warnp{color:var(--warn);border-color:rgba(245,158,11,.4)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{position:sticky;top:0;background:var(--bg2);text-align:left;font-weight:600;color:var(--fg3);font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
.tbl th.sorted{color:var(--accent)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:rgba(34,211,238,.05)}
.tbl tr.sel td{background:var(--accent-dim)}
.twrap{overflow:auto;max-height:520px;border-radius:8px;border:1px solid var(--line)}
.bar{height:6px;border-radius:3px;background:rgba(148,163,184,.15);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:3px}
.muted{color:var(--fg3)}
.empty{color:var(--fg3);padding:30px;text-align:center}
.count{color:var(--fg3);font-weight:500}

/* charts */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);fill:var(--fg3);font-size:10.5px}
.chart .grid line{stroke:rgba(148,163,184,.1)}
.chart .axis line,.chart .axis path{stroke:rgba(148,163,184,.25)}
.tip{position:fixed;pointer-events:none;background:#0F1522;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--fg);z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:260px;display:none}
.tip b{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--fg2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:3px;border-radius:2px}
.heat{display:grid;gap:3px}
.heat .cell{aspect-ratio:1;border-radius:3px;cursor:pointer;position:relative;transition:transform .1s}
.heat .cell:hover{transform:scale(1.15);z-index:2;outline:1px solid var(--fg)}
.hgrid{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;align-items:center;font-size:11px}
.hgrid .row{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px}
.hgrid .row .cell{height:22px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--mono)}
.hgrid .row .cell:hover{outline:1px solid var(--fg)}

/* drawer */
#drawer{position:fixed;top:env(safe-area-inset-top,0px);right:0;bottom:0;width:var(--drawer);max-width:100vw;background:rgba(15,21,34,.96);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .25s ease;z-index:30;display:flex;flex-direction:column;backdrop-filter:blur(14px);box-shadow:-20px 0 60px rgba(0,0,0,.5)}
#drawer.open{transform:none}
#drawer header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
#drawer header h2{margin:0;font-size:16px;font-weight:600}
#drawer header .sub{color:var(--fg3);font-size:11px;margin-top:2px;font-family:var(--mono)}
#drawer header button{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--fg2);width:28px;height:28px}
#drawer .tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#drawer .tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--fg3);padding:8px 10px;font-size:12px;white-space:nowrap}
#drawer .tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
#drawer .body{overflow:auto;padding:14px 16px 24px;flex:1;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:12px}
.kv dt{color:var(--fg3)}.kv dd{margin:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.sec h4{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--fg3)}
.tree{font-family:var(--mono);font-size:11px;line-height:1.7}
.tree .n{display:flex;gap:6px;align-items:center;cursor:pointer;border-radius:4px;padding:0 4px}
.tree .n:hover{background:rgba(255,255,255,.04)}
.tree .n.sus{color:var(--serious)}
.tree .pid{color:var(--fg3)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--fg);font-size:12px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--line2)}
.btn.primary{background:linear-gradient(135deg,rgba(34,211,238,.25),rgba(14,165,233,.25));border-color:var(--line2);color:#fff}
.btn.danger{border-color:rgba(244,63,94,.4);color:var(--crit)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0F1522;border:1px solid var(--line2);color:var(--fg);padding:10px 16px;border-radius:10px;font-size:12px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* palette */
#pal{position:fixed;inset:0;background:rgba(5,8,14,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:70}
#pal.open{display:flex}
#pal .box{width:min(640px,92vw);background:#0F1522;border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#pal input{width:100%;background:transparent;border:0;outline:0;padding:16px 18px;font-size:15px;border-bottom:1px solid var(--line)}
#pal .list{max-height:50vh;overflow:auto}
#pal .it{padding:10px 18px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13px}
#pal .it.active,#pal .it:hover{background:var(--accent-dim)}
#pal .it .k{color:var(--fg3);font-size:11px;margin-left:auto;font-family:var(--mono)}

/* force map */
#map{width:100%;height:560px;border-radius:8px;background:radial-gradient(600px 400px at 50% 50%,rgba(14,165,233,.06),transparent 70%);cursor:grab;display:block}
.maplegend{position:absolute;top:50px;left:24px;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--fg2);background:rgba(11,15,23,.6);padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
.mapctl{position:absolute;top:50px;right:24px;display:flex;gap:6px}
.radar text{font-size:10px}
.matrix{display:grid;gap:3px;font-size:10.5px}
.matrix .c{height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--mono)}
.matrix .h{color:var(--fg3);display:flex;align-items:center;justify-content:center;font-size:10px;text-align:center}
.gauge{display:flex;align-items:center;gap:14px}
.gauge svg{width:120px;height:120px}
.timeline{position:relative;padding-left:14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.timeline .ev{position:relative;font-size:12px}
.timeline .ev::before{content:"";position:absolute;left:-18px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--fg3)}
.timeline .ev.critical::before{background:var(--crit);box-shadow:0 0 8px var(--crit)}.timeline .ev.high::before{background:var(--serious)}.timeline .ev.medium::before{background:var(--warn)}
.timeline .t{color:var(--fg3);font-family:var(--mono);font-size:10.5px}
.queue{display:flex;flex-direction:column;gap:8px}
.qitem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);align-items:center}
.qitem .p{font-family:var(--mono);font-size:11px;color:var(--fg2);overflow-wrap:anywhere}
.qitem .a{display:flex;gap:6px}
.qitem .a button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg2)}
.qitem .a button:hover{color:var(--fg);border-color:var(--line2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ====================== data integrity guards ======================
   Same idea as TTP-Nexus build/harness.js: the dataset must satisfy a set of
   invariants before anything renders. Runs on the demo data at boot and on
   every API payload once the HUD is wired to hv-api. Failures go to
   console.error (picked up by hud/test/check_hud.py in CI) and to a banner. */
const SHA_RE=/^[0-9a-f]{12,64}$/, HOST_RE=/^[A-Za-z0-9._-]{1,128}$/, IP_RE=/^(\d{1,3}\.){3}\d{1,3}$|^[0-9a-f:]+$/i;
const SEV_SET=new Set(SEVS), TIER_SET=new Set(TIERS), OU_SET=new Set(OUS);
function checkInvariants(){
  const fail=[]; const t=(cond,msg)=>{if(!cond)fail.push(msg)};
  const ids=new Set(hosts.map(h=>h.id)); t(ids.size===hosts.length,"host ids must be unique");
  for(const h of hosts){ t(HOST_RE.test(h.id),`bad host id ${h.id}`); t(IP_RE.test(h.ip),`bad ip ${h.ip} on ${h.id}`); t(TIER_SET.has(h.tier),`unknown tier ${h.tier}`); t(OU_SET.has(h.ou),`unknown OU ${h.ou}`); t(h.posture>=0&&h.posture<=100,`posture out of range on ${h.id}`); t(h.vulns.every(v=>v>=0&&v<CVES.length),`vuln index out of range on ${h.id}`); t(h.listening.every(p=>p>0&&p<65536),`bad port on ${h.id}`); }
  for(const f of flows){ t(ids.has(f.src)&&ids.has(f.dst),`flow references unknown host ${f.src}>${f.dst}`); t(f.port>0&&f.port<65536,`bad flow port ${f.port}`); t(f.bytes>=0&&f.count>=0,"negative flow counters"); }
  for(const a of alerts){ t(ids.has(a.host),`alert ${a.id} on unknown host`); t(SEV_SET.has(a.sev),`alert ${a.id} bad severity`); t(ATTACK.some(x=>x[0]===a.tactic),`alert ${a.id} unknown tactic ${a.tactic}`); t(a.ts<=NOW&&a.ts>NOW-30*DAY,`alert ${a.id} timestamp out of window`); }
  for(const f of fim){ t(ids.has(f.host),"fim change on unknown host"); t(SHA_RE.test(f.hash),`bad fim hash ${f.hash}`); t(["suspicious","config","patch"].includes(f.cls),"bad fim class"); }
  for(const q of queue){ t(ids.has(q.host),"queue item on unknown host"); t(SHA_RE.test(q.hash),"bad queue hash"); }
  for(const c of CVES){ t(/^CVE-\d{4}-\d{4,}$/.test(c[0]),`bad CVE id ${c[0]}`); t(c[2]>=0&&c[2]<=10,`CVSS out of range ${c[0]}`); }
  t(RULES.every(r=>SEV_SET.has(r[1])&&ATTACK.some(x=>x[0]===r[2])),"rule table inconsistent");
  if(fail.length){ console.error("HostVigil data integrity:",fail.slice(0,20)); const b=document.createElement("div"); b.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99;background:var(--crit);color:#fff;padding:6px 12px;font-size:12px"; b.textContent=`Data integrity check failed: ${fail.length} violation(s). See console.`; document.body.appendChild(b); }
  else console.info(`HostVigil data integrity: ${hosts.length} hosts, ${flows.length} flows, ${alerts.length} alerts, ${fim.length} file changes verified`);
  return fail;
}

/* ---- policy ---- */
function vPolicy(hs){
  const ids=new Set(hs.map(h=>h.id));const fl=flows.filter(f=>ids.has(f.src)&&ids.has(f.dst));const T=TIERS;const pair=d3.rollup(fl,v=>v.length,f=>hostById[f.src].tier+">"+hostById[f.dst].tier);
  const allowed=new Set(["Web>App","App>DB","Web>DC","App>DC","Workstation>DC","Workstation>Web","Workstation>Infra","Infra>DC","Infra>DB","DC>DC"]);
  const total=fl.length,blocked=fl.filter(f=>!allowed.has(hostById[f.src].tier+">"+hostById[f.dst].tier)).length;
  main.innerHTML=`<div class="grid">${card("s8 glow","Microsegmentation policy canvas",`<div class="matrix" style="grid-template-columns:110px repeat(${T.length},1fr)" id="pm"></div><div class="legend" style="margin-top:8px"><span><i style="background:var(--good)"></i>allowed</span><span><i style="background:var(--crit)"></i>would be dropped</span><span class="muted">rows = source tier · columns = destination tier · number = observed flows · click to toggle</span></div>`,`<span class="right">policy v13 · staged</span>`)}
    ${card("s4","Simulation",`<div class="gauge"><div id="g1"></div><div><div class="v num" style="font-size:22px;font-weight:700">${total-blocked}<span class="muted" style="font-size:12px;font-weight:400"> / ${total} flows keep working</span></div><div class="muted" style="margin-top:6px"><b style="color:var(--crit)">${blocked}</b> historical flows would be dropped across ${new Set(fl.filter(f=>!allowed.has(hostById[f.src].tier+">"+hostById[f.dst].tier)).map(f=>f.src)).size} hosts.</div><div class="actions" style="margin-top:12px"><button class="btn primary" id="p-stage">Stage to 10% ring</button><button class="btn" id="p-diff">Diff v12</button></div></div></div>`,`<span class="right">${S.range}d history</span>`)}
    ${card("s12","Flows the policy would drop",flowTable(fl.filter(f=>!allowed.has(hostById[f.src].tier+">"+hostById[f.dst].tier)).slice(0,30)),`<span class="right">${blocked} flows · review before enforcing</span>`)}</div>`;
  const pm=document.getElementById("pm");pm.innerHTML=`<div class="h">src ↓ / dst →</div>${T.map(t=>`<div class="h"><span class="tier"><i style="background:${TIERC[t]}"></i>${t}</span></div>`).join("")}`+T.map(s=>`<div class="h" style="justify-content:flex-start"><span class="tier"><i style="background:${TIERC[s]}"></i>${s}</span></div>${T.map(d=>{const k=s+">"+d,n=pair.get(k)||0,ok=allowed.has(k);return`<div class="c" data-k="${k}" style="background:${n?(ok?"rgba(16,185,129,.25)":"rgba(244,63,94,.3)"):(ok?"rgba(16,185,129,.08)":"rgba(148,163,184,.05)")};color:${n?"var(--fg)":"var(--fg3)"};border:1px solid ${ok?"rgba(16,185,129,.35)":"transparent"}">${n||"·"}</div>`}).join("")}`).join("");
  pm.querySelectorAll(".c").forEach(c=>{c.onmousemove=e=>showTip(e,`<b>${c.dataset.k.replace(">"," → ")}</b><br>${pair.get(c.dataset.k)||0} flows · ${allowed.has(c.dataset.k)?"allowed":"blocked"}`);c.onmouseleave=hideTip;c.onclick=()=>{allowed.has(c.dataset.k)?allowed.delete(c.dataset.k):allowed.add(c.dataset.k);toast(`Policy edited: ${c.dataset.k.replace(">"," → ")} ${allowed.has(c.dataset.k)?"allowed":"blocked"} (unsaved)`);}});
  gauge(document.getElementById("g1"),100*(total-blocked)/Math.max(1,total),"keep working",blocked/total>.1?"var(--warn)":"var(--good)");
  document.getElementById("p-stage").onclick=()=>toast("Policy v13 staged to ring 1 (10% of hosts). Requires Enforcer role to apply.");document.getElementById("p-diff").onclick=()=>toast("v12 → v13: +2 allow rules (Infra→DB, DC→DC), −1 (Workstation→DB)");bindRows();
}

    ${card("s6","Top firing rules",`<div class="chart" id="c-rules"></div>`,`<span class="right">Sigma</span>`)}
    ${card("s6","Noisiest hosts",`<div class="chart" id="c-hosts"></div>`,`<span class="right">click to drill</span>`)}
    ${card("s12 glow","Alert stream",alertTable(al.slice(0,120)),`<span class="right">${al.length} alerts · newest first</span>`)}</div>`;
  barChart(document.getElementById("c-rules"),byR.slice(0,8).map(([r,n])=>({label:r,value:n,color:{critical:"var(--crit)",high:"var(--serious)",medium:"var(--warn)",low:"var(--good)"}[RULES.find(x=>x[0]===r)[1]],sub:"alerts ·"})),{lw:200});
  barChart(document.getElementById("c-hosts"),byH.slice(0,8).map(([h,n])=>({label:h,value:n,color:TIERC[hostById[h].tier],sub:"alerts ·",onClick:()=>openHost(h,"alerts")})),{lw:100});
  const tc=document.getElementById("tc");if(tc)tc.onclick=()=>{S.tactic=null;renderMain()};bindRows();
}
/* ---- fleet ---- */
function vFleet(hs){
  const vers=d3.rollups(hs,v=>v.length,h=>h.agentVer).sort();
  main.innerHTML=`<div class="grid">${card("s3 kpi","Agents",`<div class="v num">${hs.length}</div><div class="d"><b style="color:var(--good)">${hs.filter(h=>h.agentOk).length}</b> online · <b style="color:var(--crit)">${hs.filter(h=>!h.agentOk).length}</b> offline</div>`)}${card("s3 kpi","Latest version",`<div class="v num">${Math.round(100*hs.filter(h=>h.agentVer==="0.4.2").length/hs.length)}%</div><div class="d">on 0.4.2 · ring 3 rolling out</div>`)}${card("s3 kpi","Avg CPU",`<div class="v num">${(d3.mean(hs,h=>h.cpu)||0).toFixed(1)}%</div><div class="d">budget 2.0% · peak ${d3.max(hs,h=>h.cpu)}%</div>`)}${card("s3 kpi","Avg RAM",`<div class="v num">${Math.round(d3.mean(hs,h=>h.mem)||0)} MB</div><div class="d">budget 150 MB</div>`)}
    ${card("s12 glow","Agent grid",`<div class="heat" style="grid-template-columns:repeat(auto-fill,minmax(28px,1fr))" id="ag"></div><div class="legend" style="margin-top:8px"><span><i style="background:var(--good)"></i>0.4.2 online</span><span><i style="background:var(--c6)"></i>0.4.1</span><span><i style="background:var(--c3)"></i>0.3.9</span><span><i style="background:var(--crit)"></i>offline</span></div>`,`<span class="right">one cell per agent</span>`)}
    ${card("s6","Update rings",`<div class="timeline">${[["Ring 0 · canary (5 hosts)","done","0.4.2 · completed 3d ago"],["Ring 1 · 10% (12 hosts)","done","0.4.2 · completed 1d ago"],["Ring 2 · 40% (50 hosts)","active","0.4.2 · 71% complete"],["Ring 3 · remainder","pending","scheduled, waits on ring 2 soak"]].map(([l,s,d])=>`<div class="ev ${s==="active"?"medium":s==="done"?"low":""}"><div>${l} <span class="pill ${s==="done"?"ok":s==="active"?"warnp":""}">${s}</span></div><div class="t">${d}</div></div>`).join("")}</div><div class="actions" style="margin-top:12px"><button class="btn primary" id="f-push">Advance ring 3</button><button class="btn" id="f-bundle">Import offline bundle</button></div>`)}
    ${card("s6","Version distribution",`<div class="chart" id="c-ver"></div>`)}
    ${card("s12","Offline agents",`<div class="twrap"><table class="tbl"><thead><tr><th>Host</th><th>OU</th><th>Version</th><th>Last seen</th><th>Queue depth</th><th>Action</th></tr></thead><tbody>${hs.filter(h=>!h.agentOk).map(h=>`<tr class="row" data-host="${h.id}"><td class="mono">${h.id}</td><td>${h.ou}</td><td class="mono">${h.agentVer}</td><td class="muted">${ago(h.lastSeen)}</td><td class="num">${ri(200,9000)} events</td><td><span class="pill">wake / check SCM</span></td></tr>`).join("")||`<tr><td colspan="6" class="empty">All agents online</td></tr>`}</tbody></table></div>`)}</div>`;
  const ag=document.getElementById("ag");ag.innerHTML=hs.map(h=>`<div class="cell" data-h="${h.id}" style="background:${!h.agentOk?"var(--crit)":h.agentVer==="0.4.2"?"var(--good)":h.agentVer==="0.4.1"?"var(--c6)":"var(--c3)"};opacity:.85"></div>`).join("");ag.querySelectorAll(".cell").forEach(c=>{const h=hostById[c.dataset.h];c.onmousemove=e=>showTip(e,`<b>${h.id}</b><br>v${h.agentVer} · ${h.agentOk?"online":"offline "+ago(h.lastSeen)}<br>CPU ${h.cpu}% · RAM ${h.mem} MB`);c.onmouseleave=hideTip;c.onclick=()=>openHost(h.id,"agent")});
  barChart(document.getElementById("c-ver"),vers.map(([v,n])=>({label:"v"+v,value:n,color:v==="0.4.2"?"var(--good)":v==="0.4.1"?"var(--c6)":"var(--c3)",sub:"agents ·"})),{lw:80});
  document.getElementById("f-push").onclick=()=>toast("Ring 3 advanced: 0.4.2 pushed to 57 agents (signed bundle verified)");document.getElementById("f-bundle").onclick=()=>toast("Select a .hvb bundle — signature is verified before import");bindRows();
}

/* ====================== drawer (drill-down) ====================== */
const drawer=document.getElementById("drawer");
function openHost(id,tab){S.sel=id;S.selKind="host";if(tab)S.tab=tab;else if(!["summary","alerts","flows","files","software","agent","posture"].includes(S.tab))S.tab="summary";renderDrawer();main.querySelectorAll("tr.sel").forEach(r=>r.classList.remove("sel"));main.querySelectorAll(`tr[data-host="${id}"]`).forEach(r=>r.classList.add("sel"))}
function openCve(i){S.sel=i;S.selKind="cve";renderDrawer()}
function closeDrawer(){S.sel=null;drawer.classList.remove("open")}
function renderDrawer(){
  if(S.sel===null)return;drawer.classList.add("open");
  if(S.selKind==="cve"){const c=CVES[S.sel];const hv=hosts.filter(h=>h.vulns.includes(S.sel));drawer.innerHTML=`<header><div><h2 class="mono">${c[0]}</h2><div class="sub">${c[1]} · CVSS ${c[2]}${c[3]?" · CISA KEV":""}</div></div><button id="dcl" aria-label="Close">×</button></header><div class="body"><div class="actions"><button class="btn primary">Create patch task</button><button class="btn">Accept risk</button><button class="btn">Export CSV</button></div><div class="sec"><h4>Affected hosts (${hv.length})</h4><div class="twrap" style="max-height:420px"><table class="tbl"><thead><tr><th>Host</th><th>Tier</th><th>Posture</th><th>Exposed</th></tr></thead><tbody>${hv.map(h=>`<tr class="row" data-host="${h.id}"><td class="mono">${h.id}</td><td><span class="tier"><i style="background:${TIERC[h.tier]}"></i>${h.tier}</span></td><td class="num" style="color:${postureColor(h.posture)}">${h.posture}</td><td>${h.tier==="Web"||h.listening.includes(3389)?'<span class="sev high">reachable</span>':'<span class="muted">internal</span>'}</td></tr>`).join("")}</tbody></table></div></div></div>`;drawer.querySelector("#dcl").onclick=closeDrawer;drawer.querySelectorAll("tr[data-host]").forEach(r=>r.onclick=()=>openHost(r.dataset.host));return}
  const h=hostById[S.sel];if(!h)return;const al=alerts.filter(a=>a.host===h.id).slice(0,40);const fl=flows.filter(f=>f.src===h.id||f.dst===h.id);const fm=fim.filter(f=>f.host===h.id);
  const tabs=[["summary","Summary"],["posture","Posture"],["alerts",`Alerts ${al.length}`],["flows",`Flows ${fl.length}`],["files",`Files ${fm.length}`],["software",`Software ${h.soft.length}`],["agent","Agent"]];
  let body="";
  if(S.tab==="summary")body=`<div class="actions"><button class="btn primary" id="iso">Isolate host</button><button class="btn" id="rem">Run remediation</button><button class="btn" id="rep">Export report</button></div>
    <div class="sec"><h4>Identity</h4><dl class="kv"><dt>IP</dt><dd>${h.ip}</dd><dt>OS</dt><dd>${h.os}</dd><dt>OU</dt><dd>${h.ou}</dd><dt>Tier</dt><dd>${h.tier}</dd><dt>Criticality</dt><dd>${h.crit}</dd><dt>Owner</dt><dd>${h.tier==="Workstation"?["j.doe","a.khan","m.rossi"][parseInt(h.id.slice(-3))%3]:"platform-ops"}</dd><dt>Listening</dt><dd>${h.listening.join(", ")}</dd><dt>Local admins</dt><dd style="color:${h.localAdmins>2?"var(--serious)":"inherit"}">${h.localAdmins}</dd><dt>BitLocker</dt><dd>${h.bitlocker?"on":'<span style="color:var(--warn)">off</span>'}</dd><dt>TPM</dt><dd>${h.tpm?"2.0 attested":'<span style="color:var(--warn)">missing</span>'}</dd></dl></div>
    <div class="sec"><h4>Posture ${h.posture}</h4><div id="d-radar"></div></div>
    <div class="sec"><h4>Process tree (live)</h4><div class="tree">${procTree(h)}</div></div>
    <div class="sec"><h4>Drift findings (${h.drift})</h4>${h.drift?`<ul style="margin:0;padding-left:18px;color:var(--fg2)">${DRIFT.slice(0,h.drift).map(d=>`<li>${d}</li>`).join("")}</ul>`:`<div class="muted">No drift from baseline</div>`}</div>`;
  else if(S.tab==="posture"){const ax=[{l:"Patching",v:Math.max(10,h.posture-h.vulns.length*5)},{l:"Config",v:Math.max(10,100-h.drift*9)},{l:"Identity",v:h.localAdmins>2?48:86},{l:"Encryption",v:h.bitlocker?(h.tpm?95:70):25},{l:"Network",v:Math.max(20,100-h.listening.length*9)},{l:"Allowlist",v:h.allowMode==="Enforce"?92:55}];body=`<div class="sec"><h4>Posture radar</h4><div id="d-radar"></div></div><div class="sec"><h4>Dimensions</h4>${ax.map(a=>`<div style="display:grid;grid-template-columns:90px 1fr 30px;gap:8px;align-items:center;margin-bottom:6px;font-size:12px"><span>${a.l}</span><div class="bar"><i style="width:${a.v}%;background:${postureColor(a.v)}"></i></div><span class="num" style="text-align:right">${a.v}</span></div>`).join("")}</div><div class="sec"><h4>CIS checks failing</h4><ul style="margin:0;padding-left:18px;color:var(--fg2)">${DRIFT.slice(0,Math.max(1,h.drift)).map(d=>`<li>${d}</li>`).join("")}</ul></div><div class="actions"><button class="btn primary" id="rem">Remediate all (rollback snapshot first)</button></div>`}
  else if(S.tab==="alerts")body=`<div class="timeline">${al.length?al.map(a=>`<div class="ev ${a.sev}"><div><span class="sev ${a.sev}">${a.sev}</span> ${esc(a.rule)}</div><div class="t">${fmtT(a.ts)} · ${a.proc} · ${a.user} · ${ATTACK.find(t=>t[0]===a.tactic)[1]} · ${a.status}</div></div>`).join(""):`<div class="muted">No alerts</div>`}</div>`;
  else if(S.tab==="flows")body=`<div class="sec"><h4>Outbound (${fl.filter(f=>f.src===h.id).length})</h4>${flowList(fl.filter(f=>f.src===h.id),"dst")}</div><div class="sec"><h4>Inbound (${fl.filter(f=>f.dst===h.id).length})</h4>${flowList(fl.filter(f=>f.dst===h.id),"src")}</div>`;
  else if(S.tab==="files")body=`<div class="timeline">${fm.length?fm.map(f=>`<div class="ev ${f.cls==="suspicious"?"critical":f.cls==="config"?"medium":""}"><div class="mono" style="font-size:11px">${esc(f.path)}</div><div class="t">${fmtT(f.ts)} · ${f.kind} by ${f.proc} (${f.user}) · <span class="sev ${f.cls==="suspicious"?"critical":f.cls==="config"?"medium":"low"}">${f.cls}</span></div></div>`).join(""):`<div class="muted">No changes in watched paths</div>`}</div>`;
  else if(S.tab==="software")body=`<div class="sec"><h4>Installed software</h4><table class="tbl"><tbody>${h.soft.map(s=>{const v=h.vulns.map(i=>CVES[i]).filter(c=>c[1].toLowerCase().includes(s.split(" ")[0].toLowerCase()));return`<tr><td>${s}</td><td>${v.length?`<span class="sev ${v[0][2]>=9?"critical":"high"}">${v[0][0]}</span>`:'<span class="muted">—</span>'}</td></tr>`}).join("")}</tbody></table></div><div class="sec"><h4>Vulnerabilities (${h.vulns.length})</h4><table class="tbl"><tbody>${h.vulns.map(i=>`<tr class="row" data-cve="${i}"><td class="mono">${CVES[i][0]}</td><td>${CVES[i][1]}</td><td class="num" style="color:${CVES[i][2]>=9?"var(--crit)":"var(--serious)"}">${CVES[i][2]}</td><td>${CVES[i][3]?'<span class="sev critical">KEV</span>':""}</td></tr>`).join("")||'<tr><td class="muted">None</td></tr>'}</tbody></table></div><div class="sec"><h4>Allowlist</h4><dl class="kv"><dt>Mode</dt><dd>${h.allowMode}</dd><dt>Policy</dt><dd>wdac-${h.tier.toLowerCase()}-v12</dd><dt>Violations 7d</dt><dd>${alerts.filter(a=>a.host===h.id&&a.rule.startsWith("Allowlist")).length}</dd></dl></div>`;
  else if(S.tab==="agent")body=`<dl class="kv"><dt>Status</dt><dd>${h.agentOk?'<span class="pill ok">online</span>':'<span class="pill bad">offline</span>'}</dd><dt>Version</dt><dd>${h.agentVer}</dd><dt>Last seen</dt><dd>${ago(h.lastSeen)}</dd><dt>Boot id</dt><dd>${h.id.split("-")[1]}f3a9-${h.ip.split(".")[2]}</dd><dt>CPU</dt><dd>${h.cpu}%</dd><dt>RAM</dt><dd>${h.mem} MB</dd><dt>Queue</dt><dd>${h.agentOk?ri(0,40):ri(200,9000)} events buffered</dd><dt>Cert expires</dt><dd>${new Date(NOW+ri(20,80)*DAY).toISOString().slice(0,10)}</dd><dt>Modules</dt><dd>etw ✓ wfp ✓ fim ✓ inventory ✓ allowlist ${h.allowMode==="Enforce"?"✓":"audit"} baseline ✓</dd></dl><div class="actions"><button class="btn">Restart service</button><button class="btn">Rotate certificate</button><button class="btn danger">Revoke</button></div>`;
  drawer.innerHTML=`<header><div><h2 class="mono">${h.id}</h2><div class="sub">${h.ip} · ${h.os} · ${h.ou}</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="tier"><i style="background:${TIERC[h.tier]}"></i>${h.tier}</span><span class="sev ${h.crit==="Critical"?"critical":h.crit==="High"?"high":h.crit==="Medium"?"medium":"low"}">${h.crit}</span><span class="pill" style="color:${postureColor(h.posture)}">posture ${h.posture}</span>${h.agentOk?"":'<span class="pill bad">agent offline</span>'}</div></div><button id="dcl" aria-label="Close">×</button></header><div class="tabs">${tabs.map(([k,l])=>`<button class="${S.tab===k?"active":""}" data-tab="${k}">${l}</button>`).join("")}</div><div class="body">${body}</div>`;
  drawer.querySelector("#dcl").onclick=closeDrawer;drawer.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;renderDrawer()});
  const rd=drawer.querySelector("#d-radar");if(rd)radar(rd,[{l:"Patching",v:Math.max(10,h.posture-h.vulns.length*5)},{l:"Config",v:Math.max(10,100-h.drift*9)},{l:"Identity",v:h.localAdmins>2?48:86},{l:"Encryption",v:h.bitlocker?(h.tpm?95:70):25},{l:"Network",v:Math.max(20,100-h.listening.length*9)},{l:"Allowlist",v:h.allowMode==="Enforce"?92:55}]);
  drawer.querySelectorAll("tr[data-cve]").forEach(r=>r.onclick=()=>openCve(+r.dataset.cve));drawer.querySelectorAll("[data-host]").forEach(r=>r.onclick=()=>openHost(r.dataset.host));
  const iso=drawer.querySelector("#iso");if(iso)iso.onclick=()=>toast(`Isolation staged for ${h.id}: WFP block-all except hv-ingest. Needs Enforcer approval.`);const rem=drawer.querySelector("#rem");if(rem)rem.onclick=()=>toast(`Remediation queued on ${h.id}: ${h.drift} drift findings, rollback snapshot first`);const rep=drawer.querySelector("#rep");if(rep)rep.onclick=()=>toast("Host report exported (PDF + JSON) to /exports");
}
function procTree(h){const sus=alerts.find(a=>a.host===h.id&&a.sev!=="low");const base=[["System",4,0],["smss.exe",388,1],["wininit.exe",520,1],["services.exe",612,2],["svchost.exe",904,3],["lsass.exe",640,2],["winlogon.exe",580,1],["explorer.exe",3120,2]];if(h.tier==="Web")base.push(["w3wp.exe",4412,3]);if(h.tier==="DB")base.push(["sqlservr.exe",2810,3]);if(sus)base.push([sus.proc,ri(5000,9000),3],["cmd.exe",ri(9000,9900),4]);return base.map(([n,p,d],i)=>`<div class="n ${sus&&i>=base.length-2?"sus":""}" style="padding-left:${d*14+4}px">${d?"└ ":""}${n} <span class="pid">${p}</span>${sus&&i>=base.length-2?' <span class="sev high">alert</span>':""}</div>`).join("")}
function flowList(fl,side){return fl.length?`<table class="tbl"><tbody>${fl.slice(0,30).map(f=>`<tr class="row" data-host="${f[side]}"><td class="mono">${f[side]}</td><td class="mono muted">${f.proc}</td><td class="mono">:${f.port}</td><td class="num">${fmtB(f.bytes)}</td><td>${suspiciousFlows.has(f.src+">"+f.dst)?'<span class="sev critical">!</span>':""}</td></tr>`).join("")}</tbody></table>`:`<div class="muted">None</div>`}

/* ====================== command palette ====================== */
const pal=document.getElementById("pal"),palq=document.getElementById("palq"),pallist=document.getElementById("pallist");let palIdx=0,palItems=[];
function palOpen(){pal.classList.add("open");palq.value="";palSearch("");palq.focus()}function palClose(){pal.classList.remove("open")}
function palSearch(q){q=q.toLowerCase();const views=VIEWS.map(([v,l])=>({l:"Go to "+l,k:"view",run:()=>go(v)}));const acts=[{l:"Clear all filters",k:"action",run:()=>{for(const k of["ou","tier","os","crit","sev"])S[k].clear();S.q="";persist();render()}},{l:"Show only critical alerts",k:"action",run:()=>{S.sev=new Set(["critical"]);persist();go("forensics")}},{l:"Show suspicious flows only",k:"action",run:()=>{S.mapSus=true;go("map")}},{l:"Import offline feed bundle (.hvb)",k:"action",run:()=>toast("Bundle import: pick a signed .hvb file")},{l:"Export current view as CSV",k:"action",run:()=>toast("CSV exported to /exports")}];
  const hs=hosts.filter(h=>!q||h.id.includes(q)||h.ip.includes(q)).slice(0,8).map(h=>({l:`${h.id} · ${h.ip} · ${h.tier}`,k:"host",run:()=>openHost(h.id)}));const cv=CVES.map((c,i)=>({c,i})).filter(x=>!q||x.c[0].toLowerCase().includes(q)||x.c[1].toLowerCase().includes(q)).slice(0,5).map(x=>({l:`${x.c[0]} · ${x.c[1]}`,k:"cve",run:()=>openCve(x.i)}));
  palItems=[...views.filter(v=>!q||v.l.toLowerCase().includes(q)),...acts.filter(a=>!q||a.l.toLowerCase().includes(q)),...hs,...cv].slice(0,14);palIdx=0;
  pallist.innerHTML=palItems.map((it,i)=>`<div class="it ${i===palIdx?"active":""}" data-i="${i}">${esc(it.l)}<span class="k">${it.k}</span></div>`).join("")||`<div class="it muted">No matches</div>`;pallist.querySelectorAll(".it[data-i]").forEach(e=>e.onclick=()=>{palItems[+e.dataset.i].run();palClose()})}
palq.oninput=()=>palSearch(palq.value);palq.onkeydown=e=>{if(e.key==="ArrowDown"){palIdx=Math.min(palItems.length-1,palIdx+1)}else if(e.key==="ArrowUp"){palIdx=Math.max(0,palIdx-1)}else if(e.key==="Enter"){if(palItems[palIdx]){palItems[palIdx].run();palClose()}return}else if(e.key==="Escape"){palClose();return}else return;pallist.querySelectorAll(".it").forEach((el,i)=>el.classList.toggle("active",i===palIdx))};
pal.onclick=e=>{if(e.target===pal)palClose()};
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();pal.classList.contains("open")?palClose():palOpen()}else if(e.key==="Escape"){if(pal.classList.contains("open"))palClose();else if(S.sel!==null)closeDrawer()}});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(renderMain,200)});
render();
</script>
