[workspace]
resolver = "2"
members = [
  "crates/hv-common",
  "crates/hv-proto",
  "crates/agent/hostvigil-agent",
  "crates/server/hv-ingest",
  "crates/server/hv-api",
  "crates/server/hv-analytics",
  "crates/server/hv-ca",
  "crates/server/hv-feeds",
  "crates/server/hv-cli",
  "bundles/hostvigil-bundler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tonic = { version = "0.12", features = ["tls", "tls-native-roots"] }
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
blake3 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", features = ["x509-parser", "pem"] }
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
x509-parser = "0.16"
zstd = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
clickhouse = "0.13"
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "fs"] }
jsonwebtoken = "9"
argon2 = "0.5"
rust-embed = "8"
petgraph = "0.6"
linfa = "0.7"
flume = "0.11"
clap = { version = "4", features = ["derive", "env"] }
config = "0.14"
hv-common = { path = "crates/hv-common" }
hv-proto = { path = "crates/hv-proto" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
